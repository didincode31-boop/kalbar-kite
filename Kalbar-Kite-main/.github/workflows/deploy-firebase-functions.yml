name: Deploy Firestore Rules

on:
  push:
    branches:
      - main
    paths:
      - "functions/**"
      - "firestore.rules"
      - "firebase.json"
      - ".github/workflows/deploy-firebase-functions.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-firebase-backend
  cancel-in-progress: false

jobs:
  deploy-rules:
    name: Deploy Firestore Rules (Spark-compatible)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}

      - name: Install Firebase CLI
        run: npm install --global firebase-tools

      - name: Deploy Firestore Rules
        env:
          FIREBASE_PROJECT_ID: ${{ secrets.FIREBASE_PROJECT_ID }}
        run: |
          if [ -z "$FIREBASE_PROJECT_ID" ]; then
            echo "Missing GitHub Actions secret: FIREBASE_PROJECT_ID"
            exit 1
          fi
          firebase deploy --only firestore:rules --project "$FIREBASE_PROJECT_ID" --non-interactive
