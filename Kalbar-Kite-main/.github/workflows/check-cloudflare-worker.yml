name: Check Cloudflare Worker

on:
  push:
    branches: [main]
    paths:
      - "cloudflare-worker/src/index.js"
      - ".github/workflows/check-cloudflare-worker.yml"
  pull_request:
    paths:
      - "cloudflare-worker/src/index.js"
      - "functions/**"
      - ".github/workflows/check-cloudflare-worker.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  syntax:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Check Worker JavaScript syntax
        run: node --check cloudflare-worker/src/index.js

